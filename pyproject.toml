[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recallite"
version = "0.17.0"
description = "Give any LLM permanent memory — /save facts once, every backend remembers. Works with Ollama, vLLM, Hugging Face, and any OpenAI-compatible server. Zero required dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ali" }]
keywords = ["llm", "memory", "rag", "ollama", "vllm", "huggingface", "personalization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
recallite = "recallite.cli:main"

[project.optional-dependencies]
huggingface = ["transformers", "torch", "accelerate"]
semantic = ["sentence-transformers", "numpy"]
ner = ["spacy"]
crypto = ["cryptography"]
mcp = ["mcp>=2,<3", "uvicorn"]
langchain = ["langchain-core"]
llamaindex = ["llama-index-core"]
presidio = ["presidio-analyzer"]
all = ["transformers", "torch", "accelerate", "sentence-transformers", "numpy", "spacy", "cryptography", "mcp>=2,<3", "uvicorn"]

[tool.setuptools.packages.find]
include = ["recallite*"]

[tool.setuptools.package-data]
recallite = ["uat_prompts.json"]
