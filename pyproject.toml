[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recallite"
version = "0.17.1"
description = "SQLite for AI memory: give any LLM permanent, lifecycle-aware memory — plus a vault-free privacy gateway and an MCP server. Works with Ollama, vLLM, Hugging Face, Claude, and any OpenAI-compatible backend. Zero required dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ali" }]
keywords = ["llm", "memory", "rag", "ollama", "vllm", "huggingface",
            "mcp", "privacy", "dlp", "sqlite", "agent-memory",
            "personalization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/alisaadbaig/recallite"
Repository = "https://github.com/alisaadbaig/recallite"
Issues = "https://github.com/alisaadbaig/recallite/issues"
Changelog = "https://github.com/alisaadbaig/recallite/blob/main/CHANGELOG.md"

[project.scripts]
recallite = "recallite.cli:main"

[project.optional-dependencies]
huggingface = ["transformers", "torch", "accelerate"]
semantic = ["sentence-transformers", "numpy"]
ner = ["spacy"]
crypto = ["cryptography"]
mcp = ["mcp>=2,<3", "uvicorn"]
langchain = ["langchain-core"]
llamaindex = ["llama-index-core"]
presidio = ["presidio-analyzer"]
all = ["transformers", "torch", "accelerate", "sentence-transformers",
       "numpy", "spacy", "cryptography", "mcp>=2,<3", "uvicorn",
       "presidio-analyzer", "langchain-core", "llama-index-core"]

[tool.setuptools.packages.find]
include = ["recallite*"]

[tool.setuptools.package-data]
recallite = ["uat_prompts.json"]
